name: CI

# What is left of the CI workflow on the GitHub mirror. The checks (fmt, clippy, test) moved to Jenkins
# (ci/lint-and-test.sh, yggdrasil.yml); only the measurement stays here, on the GitHub copy of the repository.
# The mirror pushes the branches, and this runs on the ones that have been merged: develop and main.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning rather than letting drift accumulate — the
  # tree is warning-free as of UC-09, so a new warning is a new regression.
  RUSTFLAGS: -D warnings

jobs:
  # NFR-02 (indexing throughput) and NFR-01's read latency under load are
  # measurements, not assertions, so they are deliberately not part of the gate
  # (Jenkins' lint-and-test): a shared runner's throughput says more about the
  # runner than about the commit. This job exists so the harness cannot rot
  # unnoticed and so the figures are recorded run over run — read them in the log.
  #
  # It runs without ALEXANDRIA_NFR_STRICT, so the throughput and latency
  # assertions are the loose floors (see the Testing Specification Document §9):
  # low enough that runner noise cannot trip them, tight enough to catch a
  # re-serialized walk or blocking I/O back on the async runtime. The
  # requirement's actual 500 files/sec target is verified on a developer
  # machine, which is what NFR-02 scopes it to.
  #
  # The floors are not the whole harness, though. It also asserts exact counts
  # — every fixture file cataloged — and those are not noise-proof: a runner
  # roughly 3.5x slower than usual pushed concurrent writers past SQLite's
  # busy_timeout and cost the run two files out of two thousand, reddening main
  # on a commit that was fine. `continue-on-error` is what makes the
  # "non-gating" in this job's name true; without it the comment above was
  # aspirational and a slow runner could fail the build.
  #
  # So: this job measures and records. It never blocks. A red mark here is a
  # prompt to read the log and compare the figures against the previous run,
  # not a broken build — and if the figures are normal but a count assertion
  # failed, that is contention, which the indexer now retries through.
  #
  # It stays a GitHub Actions job on purpose and is neither a check nor an
  # actionsCheck of the catalog: it is not required anywhere, so it need not
  # run on every branch. Only after a merge, on develop and main: on a pull
  # request this would double CI time to report a number nobody reviews.
  performance:
    name: performance (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev \
            libswresample-dev pkg-config clang

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Measure indexing throughput and read latency
        run: |
          cargo test -p alexandria-core --test throughput \
            -- --ignored --nocapture --test-threads=1
