[workspace]
members = [
    "crates/alexandria-core",
    "crates/alexandria-http",
    "crates/alexandria-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by sqlx 0.9, the highest MSRV in the dependency graph.
rust-version = "1.94"
authors = ["Artur Rios"]
repository = "https://github.com/artur-rios/alexandria-api"

[workspace.dependencies]
alexandria-core = { path = "crates/alexandria-core" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
cbindgen = "0.29"
chrono = { version = "0.4", features = ["serde"] }
epub = "2"
ffmpeg-next = "9"
# Bounded-concurrency stream combinators (`buffer_unordered`) for the indexer.
# Already in the dependency graph via sqlx and reqwest, so this adds no new
# transitive weight — only a direct, declared use of it.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
jsonwebtoken = "9"
kamadak-exif = "0.5"
lofty = "0.22"
lopdf = "0.34"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

# dev-only
image = { version = "0.25", default-features = false, features = ["jpeg"] }
little_exif = "0.6"
tempfile = "3"
zip = "2"

[profile.release]
lto = true
codegen-units = 1