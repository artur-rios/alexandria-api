[workspace]
members = [
    "crates/alexandria-core",
    "crates/alexandria-http",
    "crates/alexandria-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Artur Rios"]
repository = "https://github.com/artur-rios/alexandria-api"

[workspace.dependencies]
alexandria-core = { path = "crates/alexandria-core" }

anyhow = "1"
axum = "0.7"
cbindgen = "0.27"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

# dev-only
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1