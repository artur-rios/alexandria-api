[package]
name = "alexandria-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
chrono.workspace = true
epub.workspace = true
ffmpeg-next.workspace = true
futures-util.workspace = true
image.workspace = true
jsonwebtoken.workspace = true
kamadak-exif.workspace = true
lofty.workspace = true
lopdf.workspace = true
quick-xml.workspace = true
# The only outbound network client in this workspace, and it is reachable
# from exactly one module: `enrichment`, which is off unless the operator
# turns it on (`[metadata] enabled`). See the music enrichment design for
# why an otherwise-offline product now has an HTTP client at all.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Tests only: `jsonwebtoken` will not encode an `alg: none` token — refusing
# to produce one is the point of the library — so the test that proves we
# reject it assembles the token by hand.
# Tests only: the three enrichment clients are pointed at a local stub
# server rather than at MusicBrainz, Wikidata and LRCLIB. Their URL building
# and their JSON parsing are otherwise covered by nothing — the handler tests
# above replace the clients wholesale with fakes, so the one part that talks
# to a real HTTP surface is the part no test reaches. Already in the
# workspace for `alexandria-http`; a dev-dependency here adds no runtime
# weight.
axum.workspace = true
base64.workspace = true
little_exif.workspace = true
tempfile.workspace = true
# `test-util` on top of the workspace features: the rate-gate tests assert on
# the clock (`start_paused`), and without it a one-per-second limit could only
# be tested by actually waiting a second per case. Not in `full`.
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
# Tests only: the indexer logs each unindexable file at `warn` with its path
# and error, which is worthless without a subscriber to receive it. See
# `tests/throughput.rs`.
tracing-subscriber.workspace = true