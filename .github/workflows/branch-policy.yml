name: Branch Policy

# Enforces the branching model (CONTRIBUTING.md) on every pull request into develop or main. The
# rulesets on those branches require this check, so a pull request that breaks the model cannot be
# merged without the repository owner's bypass.
#
#   into develop  only from feature/<name>, fix/<name> (or dependabot/...), and the branch must have
#                 been cut from develop -- it may not carry any commit that is on main but not on
#                 develop, which is exactly what a branch cut from main would carry.
#   into main     only from release/<major>.<minor>.<patch>, and the release branch must be a
#                 snapshot of develop: every commit on it is already on develop. A release carries
#                 no changes of its own; a fix goes to develop through a fix/ branch and a new
#                 release is cut.
#
# GitHub cannot restrict which branch a pull request comes from, nor branch names on a personal
# account, which is why this is a workflow and not a ruleset rule.

on:
  pull_request:
    # edited: re-run when the base branch of an open pull request is changed.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the branch against the branching model
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          git fetch --no-tags --quiet origin develop main

          case "$BASE_REF" in
            develop)
              [[ "$HEAD_REF" =~ ^(feature|fix)/[a-z0-9][a-z0-9._-]*$ || "$HEAD_REF" =~ ^dependabot/ ]]                 || fail "Pull requests into develop must come from feature/<name> or fix/<name> (lowercase, digits, . _ -), not '$HEAD_REF'."

              # Commits on main that develop does not have are the release merge commits. A branch
              # that contains one of them was cut from main, not from develop.
              for commit in $(git rev-list origin/main ^origin/develop); do
                if git merge-base --is-ancestor "$commit" "$HEAD_SHA"; then
                  fail "'$HEAD_REF' was branched from main. Recreate it from develop."
                fi
              done
              ;;
            main)
              [[ "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]                 || fail "Pull requests into main must come from release/<major>.<minor>.<patch>, not '$HEAD_REF'."

              git merge-base --is-ancestor "$HEAD_SHA" origin/develop                 || fail "'$HEAD_REF' has commits that are not on develop. A release is a snapshot of develop: land the change on develop through a feature/ or fix/ branch and cut the release again."

              version="${HEAD_REF#release/}"
              if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
                fail "Version $version was already released (tag v$version exists). Bump the version."
              fi
              ;;
          esac

          echo "'$HEAD_REF' -> '$BASE_REF' follows the branching model."
