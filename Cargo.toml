[workspace]
members = [
    "crates/alexandria-core",
    "crates/alexandria-http",
    "crates/alexandria-ffi",
]
resolver = "2"

[workspace.package]
# 0.5.0 — music and audio removed (migrations 25, 26): the `audio` file type,
# playlists, play history, enrichment and the energy envelope are gone, and
# music now lives in Orpheus. Routes and FFI exports that served them are
# removed, so a client built against 0.4 refuses this core at startup.
#
# Previously 0.4.0 — an artist's picture asked for by name, so the name a
# client shows and the name a picture is stored under are the same one.
#
# Previously 0.3.0 — the energy envelope (migration 23, FR-MP-07): the sound of
# a track, measured once and read back at the position playing.
#
# Previously 0.2.0 — the metadata stamp (migration 22) and the lyrics search
# fallback.
#
# Pre-1.0, a minor bump is what a client reads as "not the core I was built
# against": `alexandria-ui` accepts a single minor line and refuses anything
# else at startup, by name and version. That check is the only thing standing
# between an owner running a stale library and a feature that quietly does
# nothing — which is exactly what a schema this release adds to, and a lookup
# this release changes the shape of, would otherwise look like.
version = "0.5.0"
edition = "2021"
# Floor set by sqlx 0.9, the highest MSRV in the dependency graph.
rust-version = "1.94"
authors = ["Artur Rios"]
license-file = "LICENSE"
repository = "https://github.com/artur-rios/alexandria-api"

[workspace.dependencies]
alexandria-core = { path = "crates/alexandria-core" }

anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
cbindgen = "0.29"
chrono = { version = "0.4", features = ["serde"] }
# 2.1.6 is the first release on zip 9; 2.1.5 brought zip 3 in alongside the
# workspace's own zip 9, with four advisories against it (RUSTSEC-2026-0367,
# -0368, -0369, -0429).
epub = "2.1.6"
ffmpeg-next = "9"
# Bounded-concurrency stream combinators (`buffer_unordered`) for the indexer.
# Already in the dependency graph via sqlx, so this adds no new transitive
# weight — only a direct, declared use of it.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Recovery codes (`auth::recovery`) draw their bytes from the operating
# system's generator. argon2 0.5 lent its `OsRng` for this; 0.6 no longer
# exposes one by default, and this is the crate it now salts with itself, at
# the version already in the graph.
getrandom = "0.4"
# UC-40 thumbnails decode and re-encode stills, so this is no longer dev-only.
# The feature list mirrors `catalog::classify`'s `FileType::Image` extension
# table exactly, so every still the indexer admits has a decoder: jpg/jpeg,
# png, webp, gif, bmp, and tif/tiff. All six are pure-Rust decoders shipped by
# the `image` crate itself — no new system dependency. The one extension
# `classify` maps to `Image` that is deliberately *not* here is `.svg`: it is
# vector, `image` is a raster crate, and rasterizing it would mean a new
# dependency. `ThumbnailHandler` rejects SVG explicitly instead.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
# 11 no longer picks a crypto backend for you: it panics at the first
# verification unless exactly one of `rust_crypto` and `aws_lc_rs` is
# enabled. `rust_crypto` is the one that fits here — it is pure Rust, where
# `aws_lc_rs` builds C and would make this the project's second system
# dependency after ffmpeg. Alexandria verifies Heimdall's ES256 tokens (`p256`
# out of that feature) and, during the overlap, its old HS256 ones (`hmac`).
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
kamadak-exif = "0.6"
lopdf = "0.47"
quick-xml = "0.42"
# Fetches Heimdall's key set (`auth::jwks`) in external mode, the only call
# Alexandria makes to another service. rustls rather than the platform's TLS,
# for the same reason as `rust_crypto` above: no further system dependency.
#
# 0.13's `rustls` feature (what 0.12 called `rustls-tls`) now means aws-lc-rs,
# which builds C, and the operating system's certificate store. So this takes
# `rustls-no-provider` and hands reqwest a client configuration built here
# from the two pieces 0.12's `rustls-tls` used: ring and the bundled Mozilla
# roots (`webpki-roots`). Same crates, same trust as before, and no aws-lc.
# `rustls` must stay on the 0.x line reqwest itself uses, or reqwest will not
# recognise the configuration; a test in `auth::jwks` fails if it does not.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
# The roots `rustls` above trusts — see `reqwest`.
webpki-roots = "1"
# Windows-only: reading this process's token to learn which account it runs as
# (UC-45). The thinnest binding available — raw FFI declarations, no wrapper
# layer — and it enters the graph only on Windows targets.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
zip = "9"

# dev-only
little_exif = "0.6"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1